<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Block Memento</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="w-100 p-4">
        <div id="invalidPage" class="alert alert-warning py-2 px-3 mb-2 d-none">
            <div class="d-flex align-items-center gap-2">
                <span style="font-size: 1.2rem;">⚠️</span>
                <p class="mb-0">This extension only works on Twitter/X pages.</p>
            </div>
        </div>
        
        <div id="mainContent" class="mx-auto w-100">
            <h3 class="mb-3 d-flex align-items-center gap-2 text-primary fw-bold">
                <span style="font-size: 1.5rem;">📝</span> Block Note
            </h3>
            <textarea id="noteInput" class="form-control mb-3" rows="3" placeholder="Write why you blocked this user..."></textarea>
            <div class="d-flex gap-2 mb-3">
                <button id="saveNote" class="btn btn-primary w-50">Save Note</button>
                <button id="deleteNote" class="btn btn-danger w-50">Delete Note</button>
            </div>
            <div id="currentNote" class="alert alert-info fw-medium mb-0 w-100 d-none">
                <div class="d-flex align-items-center gap-2 mb-2">
                    <span style="font-size: 1.2rem;">📌</span>
                    <h5 class="alert-heading mb-0">Saved Note</h5>
                </div>
                <div id="noteContent" class="text-break"></div>
            </div>
        </div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
